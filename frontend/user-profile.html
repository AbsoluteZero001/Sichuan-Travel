<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 - 四川旅游</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .favorites-section {
            margin-top: 30px;
        }
        .favorites-section h3 {
            color: #4a90c2;
            margin-bottom: 20px;
        }
        .favorite-item {
            display: flex;
            align-items: center;
            padding: 15px;
            background-color: #f8fafc;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .favorite-item img {
            width: 80px;
            height: 60px;
            object-fit: cover;
            border-radius: 5px;
            margin-right: 15px;
        }
        .favorite-info {
            flex: 1;
        }
        .favorite-info h4 {
            margin: 0 0 8px 0;
            color: #333;
        }
        .favorite-time {
            font-size: 12px;
            color: #999;
        }
        .no-favorites {
            text-align: center;
            color: #999;
            padding: 30px;
            background-color: #f8fafc;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">
                <h1>四川旅游</h1>
                <p>发现天府之国的魅力</p>
            </div>
            <nav>
                <ul>
                    <li><a href="/">首页</a></li>
                    <li><a href="/about-sichuan.html">关于四川</a></li>
                    <li><a href="/all-spots.html">景点介绍</a></li>
                    <li><a href="/travel-tips.html">旅游指南</a></li>
                </ul>
            </nav>
            <div class="auth-links">
                <span></span>
                <a href="/user-profile.html">个人中心</a>
                <a href="#" onclick="logout()">退出</a>
            </div>
        </div>
    </header>

    <main>
        <div class="container" style="padding: 40px 0;">
            <div class="form-container" style="max-width: 800px;">
                <h2>个人中心</h2>
                <div id="userInfo">
                </div>
                
                <div class="favorites-section">
                    <h3>我的收藏</h3>
                    <div id="myFavorites">
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>2026四川旅游景点推荐，四川欢迎您</p>
    </footer>

    <script src="common.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = getCurrentUser();
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            
            updateAuthLinks();
            renderUserInfo(user);
            await loadMyFavorites();
        });

        function renderUserInfo(user) {
            const info = document.getElementById('userInfo');
            
            info.innerHTML = `
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" value="${user.username || ''}" readonly>
                </div>
                <div class="form-group">
                    <label>角色</label>
                    <input type="text" value="${user.role === 'admin' ? '管理员' : '普通用户'}" readonly>
                </div>
                <div class="form-group">
                    <label>用户ID</label>
                    <input type="text" value="${user.id || ''}" readonly>
                </div>
                <div style="text-align: center; margin-top: 20px;">
                    <a href="/" class="btn btn-secondary">返回首页</a>
                </div>
            `;
        }

        async function loadMyFavorites() {
            const result = await fetchMyFavorites();
            renderMyFavorites(result.favorites);
        }

        function renderMyFavorites(favorites) {
            const container = document.getElementById('myFavorites');
            
            if (favorites.length === 0) {
                container.innerHTML = `
                    <div class="no-favorites">
                        <p>暂无收藏记录</p>
                        <p style="margin-top: 10px;">去<a href="/all-spots.html" style="color: #4a90c2;">景点介绍</a>收藏喜欢的景点吧</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = favorites.map(favorite => `
                <div class="favorite-item">
                    <img src="${favorite.spot_image || 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=sichuan%20scenery&image_size=landscape_4_3'}" alt="${favorite.spot_name}">
                    <div class="favorite-info">
                        <h4>${favorite.spot_name || '-'}</h4>
                        <div class="favorite-time">收藏时间：${favorite.created_at ? favorite.created_at.split(' ')[0] : '-'}</div>
                    </div>
                    <button class="btn btn-danger" style="padding: 5px 15px; font-size: 12px;" onclick="handleDeleteFavorite(${favorite.id})">取消收藏</button>
                </div>
            `).join('');
        }

        async function handleDeleteFavorite(id) {
            if (!confirm('确定要取消收藏这个景点吗？')) {
                return;
            }

            const response = await deleteFavorite(id);

            if (response && response.success) {
                alert('取消收藏成功！');
                await loadMyFavorites();
            } else {
                alert(response?.message || '取消收藏失败，请重试');
            }
        }
    </script>
</body>
</html>

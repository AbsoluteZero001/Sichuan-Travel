<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户登录 - 四川旅游</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">
                <h1>四川旅游</h1>
                <p>发现天府之国的魅力</p>
            </div>
            <nav>
                <ul>
                    <li><a href="/">首页</a></li>
                    <li><a href="/about-sichuan.html">关于四川</a></li>
                    <li><a href="/all-spots.html">景点介绍</a></li>
                    <li><a href="/travel-tips.html">旅游指南</a></li>
                </ul>
            </nav>
            <div class="auth-links">
                <a href="/login.html">登录</a>
                <a href="/register.html">注册</a>
            </div>
        </div>
    </header>

    <main>
        <div class="form-container">
            <h2>用户登录</h2>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" placeholder="请输入用户名" required>
                    <div class="error" id="usernameError"></div>
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" placeholder="请输入密码" required>
                    <div class="error" id="passwordError"></div>
                </div>
                <button type="submit" class="btn" id="loginBtn" style="width: 100%;">登录</button>
                <div class="login-progress" id="loginProgress"><div class="bar"></div></div>
            </form>
            <p>还没有账号？<a href="/register.html">立即注册</a></p>
        </div>
    </main>

    <footer>
        <p>2026四川旅游景点推荐，四川欢迎您</p>
    </footer>

    <script src="common.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            updateAuthLinks();
        });

        async function handleLogin(event) {
            event.preventDefault();

            clearErrors();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            let isValid = true;

            if (!username.trim()) {
                document.getElementById('usernameError').textContent = '请输入用户名';
                isValid = false;
            }

            if (!password) {
                document.getElementById('passwordError').textContent = '请输入密码';
                isValid = false;
            }

            if (!isValid) return;

            const loginBtn = document.getElementById('loginBtn');
            const progress = document.getElementById('loginProgress');
            loginBtn.disabled = true;
            progress.classList.add('active');

            try {
                const response = await loginUser({
                    username,
                    password
                });

                if (response && response.success) {
                    setCurrentUser(response.user, response.token);
                    showToast('登录成功！正在跳转...', 'success');
                    setTimeout(() => {
                        if (response.user.role === 'admin') {
                            window.location.href = '/admin-panel.html';
                        } else {
                            window.location.href = '/';
                        }
                    }, 700);
                } else {
                    progress.classList.remove('active');
                    loginBtn.disabled = false;
                    showToast(response?.message || '登录失败，请检查用户名和密码', 'error');
                }
            } catch (err) {
                progress.classList.remove('active');
                loginBtn.disabled = false;
                showToast('登录失败，请稍后重试', 'error');
            }
        }

        function clearErrors() {
            document.getElementById('usernameError').textContent = '';
            document.getElementById('passwordError').textContent = '';
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户注册 - 四川旅游</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">
                <h1>四川旅游</h1>
                <p>发现天府之国的魅力</p>
            </div>
            <nav>
                <ul>
                    <li><a href="/">首页</a></li>
                    <li><a href="/about-sichuan.html">关于四川</a></li>
                    <li><a href="/all-spots.html">景点介绍</a></li>
                    <li><a href="/travel-tips.html">旅游指南</a></li>
                </ul>
            </nav>
            <div class="auth-links">
                <a href="/login.html">登录</a>
                <a href="/register.html">注册</a>
            </div>
        </div>
    </header>

    <main>
        <div class="form-container">
            <h2>用户注册</h2>
            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" placeholder="请输入用户名" required>
                    <div class="error" id="usernameError"></div>
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" placeholder="请输入密码" required>
                    <div class="error" id="passwordError"></div>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">确认密码</label>
                    <input type="password" id="confirmPassword" placeholder="请确认密码" required>
                    <div class="error" id="confirmPasswordError"></div>
                </div>
                <button type="submit" class="btn" style="width: 100%;">注册</button>
            </form>
            <p>已有账号？<a href="/login.html">立即登录</a></p>
        </div>
    </main>

    <footer>
        <p>2026四川旅游景点推荐，四川欢迎您</p>
    </footer>

    <script src="common.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            updateAuthLinks();
        });

        async function handleRegister(event) {
            event.preventDefault();
            
            clearErrors();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            let isValid = true;

            if (username.length < 3 || username.length > 50) {
                document.getElementById('usernameError').textContent = '用户名长度必须在3-50之间';
                isValid = false;
            }

            if (password.length < 6) {
                document.getElementById('passwordError').textContent = '密码长度至少6位';
                isValid = false;
            }

            if (password !== confirmPassword) {
                document.getElementById('confirmPasswordError').textContent = '两次输入的密码不一致';
                isValid = false;
            }

            if (!isValid) return;

            const response = await registerUser({
                username,
                password
            });

            if (response && response.success) {
                alert('注册成功！请登录');
                window.location.href = 'login.html';
            } else {
                alert(response?.message || '注册失败，请重试');
            }
        }

        function clearErrors() {
            document.getElementById('usernameError').textContent = '';
            document.getElementById('passwordError').textContent = '';
            document.getElementById('confirmPasswordError').textContent = '';
        }
    </script>
</body>
</html>

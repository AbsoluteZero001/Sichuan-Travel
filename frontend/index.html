<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四川旅游 - 发现天府之国的魅力</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">
                <h1>四川旅游</h1>
                <p>发现天府之国的魅力</p>
            </div>
            <nav>
                <ul>
                    <li><a href="/">首页</a></li>
                    <li><a href="/about-sichuan.html">关于四川</a></li>
                    <li><a href="/all-spots.html">景点介绍</a></li>
                    <li><a href="/travel-tips.html">旅游指南</a></li>
                </ul>
            </nav>
            <div class="auth-links">
                <a href="/login.html">登录</a>
                <a href="/register.html">注册</a>
            </div>
        </div>
    </header>

    <section class="banner">
        <div class="banner-carousel" id="bannerCarousel">
            <div class="banner-slides" id="bannerSlides"></div>
            <div class="banner-dots" id="bannerDots"></div>
            <button class="banner-arrow banner-arrow-left" id="bannerPrev" aria-label="上一张" type="button">&lsaquo;</button>
            <button class="banner-arrow banner-arrow-right" id="bannerNext" aria-label="下一张" type="button">&rsaquo;</button>
        </div>
        <div class="banner-content">
            <h2>2026四川旅游景点推荐,<br>四川欢迎您</h2>
            <p>从雪山到盆地，从熊猫到火锅，体验不一样的四川</p>
            <a href="/all-spots.html" class="btn">开始探索</a>
        </div>
    </section>

    <section class="section" id="spots">
        <div class="container">
            <div class="section-title">
                <h3>推荐景点</h3>
                <div class="line"></div>
            </div>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="搜索景点...">
                <button onclick="searchSpots()">搜索</button>
            </div>
            <div class="spots-grid" id="spotsGrid">
            </div>
        </div>
    </section>

    <section class="section section-alt">
        <div class="container">
            <div class="section-title">
                <h3>快速导航</h3>
                <div class="line"></div>
            </div>
            <div class="features">
                <div class="feature-item" style="cursor: pointer;" onclick="navigateTo('about-sichuan.html')">
                    <h4>关于四川</h4>
                    <p>了解四川的历史文化、自然风光、特色美食和川剧艺术</p>
                    <a href="/about-sichuan.html" class="btn" style="margin-top: 15px; padding: 8px 20px; font-size: 14px;">了解更多</a>
                </div>
                <div class="feature-item" style="cursor: pointer;" onclick="navigateTo('all-spots.html')">
                    <h4>景点大全</h4>
                    <p>浏览四川所有著名景点，发现您心仪的旅游目的地</p>
                    <a href="/all-spots.html" class="btn" style="margin-top: 15px; padding: 8px 20px; font-size: 14px;">浏览景点</a>
                </div>
                <div class="feature-item" style="cursor: pointer;" onclick="navigateTo('travel-tips.html')">
                    <h4>旅游指南</h4>
                    <p>获取最佳旅游时间、交通指南、路线推荐和实用贴士</p>
                    <a href="/travel-tips.html" class="btn" style="margin-top: 15px; padding: 8px 20px; font-size: 14px;">查看攻略</a>
                </div>
                <div class="feature-item" style="cursor: pointer;" onclick="navigateTo('login.html')">
                    <h4>用户中心</h4>
                    <p>登录后可收藏景点、发表评论，记录您的旅行足迹</p>
                    <a href="/login.html" class="btn" style="margin-top: 15px; padding: 8px 20px; font-size: 14px;">立即登录</a>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <p>2026四川旅游景点推荐,四川欢迎您</p>
    </footer>

    <script src="common.js"></script>
    <script>
        let currentKeyword = '';
        let favoriteStatus = {};
        let bannerState = {
            images: [],
            index: 0,
            timer: null,
            interval: 3000
        };

        document.addEventListener('DOMContentLoaded', async () => {
            updateAuthLinks();
            await loadSpots();
        });

        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                searchSpots();
            }
        });

        async function loadSpots(keyword = '') {
            const result = await fetchSpots(keyword);
            await renderSpots(result.spots);
        }

        function searchSpots() {
            currentKeyword = document.getElementById('searchInput').value;
            loadSpots(currentKeyword);
        }

        function dedupeSpots(spots) {
            const seen = new Set();
            const result = [];
            for (const spot of spots || []) {
                if (!spot) continue;
                // 以景点名称为主键去重（同名不同 id 的重复行也合并）
                const nameKey = String(spot.name || '').trim().toLowerCase();
                const idKey = spot.id != null ? `id:${String(spot.id).trim()}` : '';
                if (nameKey && seen.has(nameKey)) continue;
                if (!nameKey && idKey && seen.has(idKey)) continue;
                if (nameKey) seen.add(nameKey); else seen.add(idKey);
                result.push(spot);
            }
            return result;
        }

        async function renderSpots(spots) {
            const grid = document.getElementById('spotsGrid');

            const uniqueSpots = dedupeSpots(spots);

            if (uniqueSpots.length === 0) {
                grid.innerHTML = '<p style="text-align: center; color: #666;">暂无景点数据</p>';
                return;
            }

            favoriteStatus = await loadFavoriteMap(uniqueSpots.map(spot => spot.id));

            grid.innerHTML = uniqueSpots.map((spot, index) => {
                const isFavorited = favoriteStatus[spot.id] || false;
                return `
                <div class="spot-card" style="animation-delay:${index * 60}ms;">
                    <img src="${spot.image || 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=sichuan%20beautiful%20scenery&image_size=landscape_4_3'}" alt="${spot.name}">
                    <div class="spot-info">
                        <h4>${spot.name}</h4>
                        <p>${spot.description ? spot.description.substring(0, 80) + '...' : '暂无简介'}</p>
                        <div style="margin-bottom: 10px;">
                            <span class="tag">${spot.season || '四季皆宜'}</span>
                            <span class="tag">${spot.city || '四川'}</span>
                        </div>
                        <div style="margin-bottom: 15px;">
                            <span style="font-size: 18px; color: #dc3545; font-weight: bold;">¥${spot.price || 0}</span>
                            <span style="margin-left: 15px; font-size: 14px; color: #666;">♥ ${spot.favorite_count || 0} 人收藏</span>
                        </div>
                        <div style="display: flex; gap: 10px;">
                            <a href="/spot-detail.html?id=${spot.id}" class="btn">查看详情</a>
                            <button class="btn btn-favorite ${isFavorited ? 'filled' : ''}" onclick="handleCardFavorite(${spot.id}, this)"><span class="heart-icon">${isFavorited ? '♥' : '♡'}</span> ${isFavorited ? '已收藏' : '收藏'}</button>
                        </div>
                    </div>
                </div>
                `;
            }).join('');

            initBannerCarousel(uniqueSpots);
        }

        // ========== 首页 Banner 轮播 ==========
        const FALLBACK_BANNER_IMG = 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=sichuan%20beautiful%20scenery&image_size=landscape_16_9';

        function initBannerCarousel(spots) {
            const carousel = document.getElementById('bannerCarousel');
            const slidesEl = document.getElementById('bannerSlides');
            const dotsEl = document.getElementById('bannerDots');
            if (!carousel || !slidesEl || !dotsEl) return;

            // 收集景点图片
            const images = (spots || [])
                .map(s => (s && s.image) ? { url: s.image, name: s.name || '', id: s.id } : null)
                .filter(Boolean)
                .filter((item, i, arr) => arr.findIndex(x => x.url === item.url) === i); // 同 URL 去重

            if (images.length === 0) {
                images.push({ url: FALLBACK_BANNER_IMG, name: '四川旅游', id: null });
            }

            bannerState.images = images;
            bannerState.index = 0;

            // 渲染 slides
            slidesEl.innerHTML = images.map((img, i) => `
                <div class="banner-slide ${i === 0 ? 'active' : ''}" data-index="${i}" style="background-image: url('${img.url}');">
                    ${img.name ? `<span class="banner-slide-caption">${img.name}</span>` : ''}
                </div>
            `).join('');

            // 渲染 dots（仅 2 张以上才显示）
            if (images.length > 1) {
                dotsEl.innerHTML = images.map((_, i) => `
                    <span class="banner-dot ${i === 0 ? 'active' : ''}" data-index="${i}"></span>
                `).join('');
                dotsEl.querySelectorAll('.banner-dot').forEach(dot => {
                    dot.addEventListener('click', () => goToBannerSlide(Number(dot.dataset.index)));
                });
            } else {
                dotsEl.innerHTML = '';
            }

            bindBannerArrows();
            startBannerAutoPlay();
        }

        function bindBannerArrows() {
            const prev = document.getElementById('bannerPrev');
            const next = document.getElementById('bannerNext');
            const carousel = document.getElementById('bannerCarousel');
            if (!prev || !next || !carousel) return;

            prev.onclick = () => { goToBannerSlide(bannerState.index - 1); resetBannerAutoPlay(); };
            next.onclick = () => { goToBannerSlide(bannerState.index + 1); resetBannerAutoPlay(); };

            // 鼠标悬停暂停，移开恢复
            carousel.onmouseenter = stopBannerAutoPlay;
            carousel.onmouseleave = startBannerAutoPlay;

            // 键盘左右切换（仅当 banner 在视口内时不影响其他表单）
            document.addEventListener('keydown', (e) => {
                const tag = (e.target.tagName || '').toLowerCase();
                if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
                if (e.key === 'ArrowLeft') { goToBannerSlide(bannerState.index - 1); resetBannerAutoPlay(); }
                if (e.key === 'ArrowRight') { goToBannerSlide(bannerState.index + 1); resetBannerAutoPlay(); }
            });
        }

        function goToBannerSlide(target) {
            const total = bannerState.images.length;
            if (total === 0) return;
            let next = target;
            if (next < 0) next = total - 1;
            if (next >= total) next = 0;

            const slides = document.querySelectorAll('.banner-slide');
            const dots = document.querySelectorAll('.banner-dot');
            slides.forEach((s, i) => s.classList.toggle('active', i === next));
            dots.forEach((d, i) => d.classList.toggle('active', i === next));

            bannerState.index = next;
        }

        function startBannerAutoPlay() {
            stopBannerAutoPlay();
            if (bannerState.images.length <= 1) return;
            bannerState.timer = setInterval(() => {
                goToBannerSlide(bannerState.index + 1);
            }, bannerState.interval);
        }

        function stopBannerAutoPlay() {
            if (bannerState.timer) {
                clearInterval(bannerState.timer);
                bannerState.timer = null;
            }
        }

        function resetBannerAutoPlay() {
            stopBannerAutoPlay();
            startBannerAutoPlay();
        }

        async function handleCardFavorite(spotId, btn) {
            const user = getCurrentUser();
            if (!user) {
                showToast('请先登录', 'warning');
                setTimeout(() => { window.location.href = 'login.html'; }, 600);
                return;
            }

            const favoriteData = await fetchSpotFavorite(spotId);
            const isFavorited = favoriteData ? favoriteData.is_favorited || false : false;

            if (isFavorited) {
                const response = await removeFavoriteBySpot(spotId);
                if (response && response.success) {
                    showToast('已取消收藏', 'info');
                    btn.classList.add('removed');
                    setTimeout(() => btn.classList.remove('removed'), 400);
                    loadSpots(currentKeyword);
                } else {
                    showToast(response?.message || '取消收藏失败', 'error');
                }
            } else {
                const response = await addFavorite(spotId);
                if (response && response.success) {
                    btn.innerHTML = '<span class="heart-icon">♥</span> 已收藏';
                    btn.classList.add('filled');
                    showToast('收藏成功', 'success');
                    loadSpots(currentKeyword);
                } else {
                    showToast(response?.message || '收藏失败', 'error');
                }
            }
        }
    </script>
</body>
</html>
